<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevConf 2026 Landing Page Design</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Navbar Section -->

  <nav id="navbar">
    <div class="nav-logo">
      <img src="./images/logo.png" alt="">
    </div>

    <div class="nav-menu">
      <ul>
        <li>Speakers</li>
        <li>Schedule</li>
        <li>Tracks</li>
        <li>Venue</li>
        <li>Blog</li>
      </ul>
    </div>

    <div class="btn">
      <button type="button">Register Now</button>
    </div>
  </nav>

  <!-- Hero Section -->
  
  <header id="hero">
    <div class="hero-content">
      <h1>Code. Connect. Create</h1>
      <p>Join 4,000+ engineers, founders, and builders at the premier developer <br> conference of 2026. Three days of
        cutting-edge
        talks, hands-on workshops,<br> and meaningful connections.</p>
    </div>
  
    <div class="hero-btn btn">
      <button type="button">Register Now</button>
    </div>
  
  </header>

</body>

</html>
